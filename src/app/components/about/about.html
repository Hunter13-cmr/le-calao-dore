<section id="about" class="about-section py-5">
  <div class="container">
    <div class="row align-items-center gy-4">
      <div class="col-lg-6">
        <div class="about-card shadow-soft p-4">
          <span class="section-label">Notre histoire</span>
          <h2>{{ title }}</h2>
          <p class="text-muted">{{ description }}</p>
          <ul class="about-list list-unstyled mt-4">
            @for(point of storyPoints; track point){
              <li><i class="bi bi-check-circle-fill"></i> {{ point }}</li>
            }
          </ul>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="about-image rounded-4 shadow-soft"></div>
      </div>
    </div>
  </div>
</section>
