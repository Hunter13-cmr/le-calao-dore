<header class="header">
  <div class="container-fluid px-4">
    <div class="header-content">
      <div class="logo">
        <span class="logo-mark">C</span>
        <span class="logo-text">Le Calao Doré</span>
      </div>

      <div class="nav-actions">
        <nav class="desktop-nav">
          @for(item of navItems; track item.anchor){
            <a
              href="{{ item.anchor }}"
              [class.active]="activeLink === item.label"
              (click)="setActive(item.label)">
              {{ item.label }}
            </a>
          }
          <a href="#contact" class="btn btn-golden nav-cta">Réserver</a>
        </nav>

        <button
          class="burger"
          [class.open]="isMenuOpen"
          (click)="toggleMenu()"
          aria-label="Ouvrir le menu mobile">
          <span></span>
          <span></span>
          <span></span>
        </button>
      </div>
    </div>

    @if(isMenuOpen){
      <nav class="mobile-nav">
        @for(item of navItems; track item.anchor){
          <a
            href="{{ item.anchor }}"
            [class.active]="activeLink === item.label"
            (click)="setActive(item.label)">
            {{ item.label }}
          </a>
        }
        <a href="#contact" class="btn btn-golden mobile-booking">Réserver</a>
      </nav>
    }
  </div>
</header>
