<section id="hero" class="hero" [style.background-image]="'url(' + backgroundImage + ')'">
  <div class="overlay"></div>
  <div class="content text-center">
    <span class="hero-tag">Restaurant camerounais haut de gamme</span>
    <h1>{{ title }}</h1>
    <p class="hero-subtitle">{{ subtitle }}</p>
    <div class="hero-actions d-flex flex-column flex-sm-row justify-content-center gap-3 mt-4">
      <a href="#menu" class="btn btn-warning btn-lg">{{ ctaPrimary }}</a>
      <a href="#contact" class="btn btn-outline-light btn-lg">{{ ctaSecondary }}</a>
    </div>
  </div>
</section>
