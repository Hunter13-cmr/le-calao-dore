<section id="temoignages" class="temoignages-section py-5">
  <div class="container">
    <div class="text-center mb-5">
      <span class="section-title small text-uppercase">Témoignages clients</span>
      <h2 class="mt-2">Ils ont adoré notre cuisine</h2>
      <p class="text-muted">Découvrez les retours de nos clients sur l’authenticité et la chaleur du Calao Doré.</p>
    </div>

    <div class="row g-4">
      @for(item of testimonials; track item.id){
        <div class="col-12 col-md-6 col-lg-4">
          <article class="card testimonial-card h-100" [ngClass]="getRatingClass(item.rating)">
            <div class="card-body d-flex flex-column">
              <div class="rating mb-3">
                @for(star of stars; track star){
                  <span class="star" [class.active]="star <= item.rating">★</span>
                }
              </div>
              <p class="testimonial-text mb-4">"{{ item.text }}"</p>
              <div class="mt-auto">
                <h5 class="testimonial-name mb-1">{{ item.name }}</h5>
                <p class="testimonial-role text-muted mb-0">{{ item.role }}</p>
              </div>
            </div>
          </article>
        </div>
      }
    </div>
  </div>
</section>
